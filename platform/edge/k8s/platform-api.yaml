apiVersion: v1
kind: Namespace
metadata:
  name: wps-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: wps-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      containers:
        - name: api
          image: wps-platform-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: platform-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: publish-worker
          image: wps-platform-api:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/workers/publish-worker.js"]
          envFrom:
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: wps-platform
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: "wps-platform-api-lb"
spec:
  type: LoadBalancer
  selector:
    app: platform-api
  ports:
    - port: 80
      targetPort: 8080
