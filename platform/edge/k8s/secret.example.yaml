# Apply after filling values:
# kubectl -n wps-edge create secret generic edge-secrets \
#   --from-literal=VALKEY_URL='rediss://...' \
#   --from-literal=SPACES_KEY='...' \
#   --from-literal=SPACES_SECRET='...' \
#   --from-literal=SPACES_BUCKET='wps-sites' \
#   --from-literal=SPACES_REGION='nyc3' \
#   --from-literal=SPACES_ENDPOINT='https://nyc3.digitaloceanspaces.com'
apiVersion: v1
kind: Secret
metadata:
  name: edge-secrets
  namespace: wps-edge
type: Opaque
stringData:
  VALKEY_URL: "REPLACE_ME"
  SPACES_KEY: "REPLACE_ME"
  SPACES_SECRET: "REPLACE_ME"
  SPACES_BUCKET: "wps-sites"
  SPACES_REGION: "nyc3"
  SPACES_ENDPOINT: "https://nyc3.digitaloceanspaces.com"
