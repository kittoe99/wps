worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  map $host $site_slug {
    default "";
    ~^(?<slug>[a-z0-9-]+)\.wpscanvas\.com$ $slug;
  }

  # Health for LB / K8s probes
  server {
    listen 8080;
    location /healthz {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }

  server {
    listen 80 default_server;
    server_name *.wpscanvas.com;

    # Reject reserved / empty hosts
    if ($site_slug = "") { return 404; }
    if ($site_slug = "www") { return 404; }
    if ($site_slug = "api") { return 404; }
    if ($site_slug = "admin") { return 404; }
    if ($site_slug = "app") { return 404; }

    root /var/www/sites/$site_slug/current;
    index index.html;

    # Optional auth_request to platform resolve API (enable via include)
    # auth_request /_resolve;
    # location = /_resolve {
    #   internal;
    #   proxy_pass http://platform-api.wps-platform.svc.cluster.local:8080/resolve/$site_slug;
    #   proxy_pass_request_body off;
    #   proxy_set_header Content-Length "";
    # }

    location / {
      try_files $uri $uri/ /index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
  }
}
